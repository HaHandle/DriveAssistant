name: Pleos vehicle integration

on:
  pull_request:
    branches: [feat/mock-training-flow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pleos-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Pleos image and vehicle service
        run: bash .github/scripts/pleos-smoke.sh
      - name: Upload Pleos validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleos-validation-evidence
          path: |
            pleos-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
